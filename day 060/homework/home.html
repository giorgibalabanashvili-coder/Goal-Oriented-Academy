<!--transition არის მოკლე ჩაწერის ფორმა რომელიც საშუალებას გვაძლევს განვსაზღვროთ ელემენტის გარკვეული თვისებები -->
<!--transition ს აქვს 4 ძირითდი პარამეტრი ესენია: -->
<!--1. property - ეს  პარამეტრი განსაზღვრავს თუ რომელი თვისება უნდა შეიცვალოს-->
    <!-- მაგალითად:background-color,color და ა.შ -->
<!--2. duration - ეს პარამეტრი განსაზღვრავს თუ რა სიჩქარით უნდა შეიცვალოს თვისება -->
     <!--მაგალითად: 1s 0.5s და ა.შ-->
<!--3. timing-function - ეს პარამეტრი განსაზღვრავს თუ როგორ უნდა შეიცვალოს თვისება -->
     <!--მაგალითად: linear, ease, ease-in, ease-out -->
<!--transition-delay - ეს პარამეტრი განსაზღვრავს იმას თუ რამდენი დროის შემდეგ უნდა დაიწყოს ანიმაცია
