<!-- position-ით ვაკონტროლებთ შვილ ელემენტებს მშობელი ელემენტის შიგნით -->
<!-- position-static ესარის default მნიშვნელობა -->
<!-- position-relative ელემენტი რჩება ჩვეულებრივად მაგრამმისი გადაადგილება შესაძლებელია მარჯვნივ,მარცხნივ,ზემოთ და ქვემოთ -->
<!-- position-absolute ელემენტი ამოვარდება ჩვეულებრივი დინებიდან და ორიენტირდება მხოლოდ უახლოეს მშობელ ელემენზე რომელსაც უწერია position-relative>
<-- position-fixed ამოვარდება დინებიდან და გაიყინება ბრაუზერის ფანჯრის მიმართ როდესაც ჩვენ ჩამოვსქროლავთ  -->
